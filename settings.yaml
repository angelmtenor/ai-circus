# settings.yaml
# Configuration file for environment variables required by the application
# Author: Angel Martinez-Tenor, 2026.
# Defines variable names, descriptions, types, constraints, and validation rules.
# Run 'make generate' after any change to sync data_model.py and .env.example.

env_variables:
  - name: LLM_PROVIDER
    description: "Default LLM provider to use (openai or google)"
    type: string
    mandatory: true
    secret: false

  - name: OPENAI_MODEL
    description: "Default OpenAI model to use"
    type: string
    mandatory: true
    secret: false

  - name: GEMINI_MODEL
    description: "Default Google/Gemini model to use"
    type: string
    mandatory: true
    secret: false

  - name: OPENAI_API_KEY
    description: API key for accessing OpenAI services for AI-related functionalities
    type: string
    mandatory: false
    secret: true
    validation:
      regex: ^sk-[A-Za-z0-9_-]{20,}$  # Basic pattern for OpenAI API key (starts with sk- and may include alphanumeric, hyphen, underscore)
      error_message: "Invalid OpenAI API key format. Expected an OpenAI key starting with sk- and at least 20 characters."

  - name: GEMINI_API_KEY
    description: API key for accessing Google services (e.g., Maps, Cloud)
    type: string
    mandatory: false
    secret: true
    validation:
      regex: ^[a-zA-Z0-9-_]{39}$  # Typical Google API key length and format
      error_message: "Invalid Google API key format. Expected a 39-character string with alphanumeric and hyphen/underscore."

  - name: TAVILY_API_KEY
    description: API key for accessing Tavily services (e.g., data aggregation)
    type: string
    mandatory: false
    secret: true
    validation:
      regex: ^[a-zA-Z0-9_-]{16,}$  # At least 16 characters, alphanumeric, hyphen, or underscore
      error_message: "Invalid Tavily API key format. Expected at least 16 alphanumeric characters."

  - name: LLM_LANGUAGES
    description: Language for the LLM responses
    type: string
    mandatory: true
    secret: false

# Optional global settings
global_settings:
  env_file: ".env"          # Default location for environment variable file
  fail_on_missing: true     # Stop execution if mandatory variables are missing
  case_sensitive: true      # Enforce case sensitivity for variable names

# Per-environment non-secret overrides.
# Secrets MUST never appear here — use .env (local) or CI/CD secret injection (cloud).
# APP_ENVIRONMENT selects the active profile (default: local).
environments:
  base:
    LLM_PROVIDER: "google"
    GEMINI_MODEL: "gemini-flash-lite-latest"
    OPENAI_MODEL: "gpt-5.4-mini"
    LLM_LANGUAGES: "English"

  local: {}
    # Local development overrides

  staging: {}
    # Staging environment profile — overrides go here

  production: {}
    # Production environment profile — overrides go here
