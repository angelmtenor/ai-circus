# Project metadata and configuration for the AI Circus project
# Author: Angel Martinez-Tenor, 2025. Adapted from https://github.com/angelmtenor/ds-template

[project]
name = "ai-circus"
version = "0.2.1" # Follow semantic versioning (MAJOR.MINOR.PATCH)
description = "Smart AI Building Block for innovative applications."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Angel Martinez-Tenor", email = "angelmtenor@gmail.com" }]
keywords = [
    "ai",
    "machine learning",
    "deep learning",
    "neural networks",
    "building block",
    "smart systems",
    "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "faiss-cpu>=1.11.0",
    "httpx>=0.28.1",
    "langchain>=0.3.25",
    "langchain-community>=0.3.24",
    "langchain-core>=1.3.3",
    "langchain-google-genai>=2.1.4",
    "langchain-openai>=0.3.16",
    "langgraph>=0.4.3",
    "loguru>=0.7.3",
    "openai>=1.50.0",
    "openai-agents>=0.3.3",
    "psutil>=7.0.0",
    "py-cpuinfo>=9.0.0",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.9.1",
    "PyYAML>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/angelmtenor/ai-circus"
Repository = "https://github.com/angelmtenor/ai-circus"
Documentation = "https://angelmtenor.github.io/ai-circus"
BugTracker = "https://github.com/angelmtenor/ai-circus/issues"

[dependency-groups]
dev = [
    "debugpy>=1.8.14",
    "deptry>=0.23.0",
    "glances>=4.3.1",
    "jupyter>=1.1.1",
    "packaging>=24.0",      # used directly by check_full_env.py
    "pre-commit>=4.2.0",
    "pyinstrument>=5.0.1",
    "pyrefly>=0.53.0",       # replaces pyright
    "python-dotenv>=1.0.1",  # used directly by check_full_env.py
    "pytest>=8.3.5",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.1.1",
    "rich>=13.7.0",          # optional pretty output for check_full_env.py
    "ruff>=0.16.0",     # `# ruff: ignore[<rule-name>]` suppressions need 0.16+
    "twine>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ──────────────────────────────────────────────────────────────────────────────
#  Ruff
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
preview = true
target-version = "py314"
line-length = 120
fix = true
extend-exclude = [".venv", "build", "dist", "notebooks_extra"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PGH", # pygrep-hooks
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "T10", # flake8-debugger
    "T20", # flake8-print
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "YTT", # flake8-2020
]
ignore = [
    "any-type",  # Dynamically typed expressions
    "unused-loop-control-variable",    # Unused loop variable
    "function-call-in-default-argument",    # Function call in argument defaults
    "undocumented-magic-method",    # Missing docstring in magic method
    "incorrect-blank-line-before-class",    # Blank line before class docstring
    "missing-blank-line-after-summary",    # Blank line between summary and description
    "multi-line-summary-first-line",    # Multi-line docstring summary
    "missing-terminal-punctuation",    # First line punctuation
    "boolean-type-hint-positional-argument",  # Boolean flag in function
    "boolean-default-value-positional-argument",  # Default Boolean flag
    "logging-f-string",    # f-string in log
    "too-many-arguments", # Too many arguments
    "assert",    # Use of assert detected
    "suspicious-subprocess-import",    # Subprocess Usage
]

[tool.ruff.lint.per-file-ignores]
"**/notebooks_extra/**" = ["ALL"]
"**.ipynb" = ["line-too-long", "undocumented-public-module", "undocumented-public-function", "undocumented-public-class", "module-import-not-at-top-of-file", "missing-required-import", "print"]
"**/__init__.py" = ["undocumented-public-package", "unused-import"]
"tests/**" = ["assert", "undocumented-public-function", "undocumented-public-module", "undocumented-public-package", "private-member-access", "useless-expression"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

# ──────────────────────────────────────────────────────────────────────────────
#  Pyrefly (replaces pyright)
# ──────────────────────────────────────────────────────────────────────────────
[tool.pyrefly]
use-ignore-files = false
project-includes = ["src"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**/*",
    "**/tests",
]
search-path = ["src", ".venv/lib/python3.14/site-packages"]
python-platform = "linux"
python-version = "3.14"
python-interpreter-path = ".venv/bin/python3"

# ──────────────────────────────────────────────────────────────────────────────
#  Pytest
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
minversion = "7.0"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
filterwarnings = [
    # Upstream warning triggered on import, not by our code — nothing here to fix.
    "ignore:'_UnionGenericAlias' is deprecated.*:DeprecationWarning:google.genai",
]
addopts = [
    "--cov=src",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-report=json",
    "--cov-report=term-missing",
    "--cov-fail-under=55",  # ratchet: current total is 58% — raise as coverage grows
    "-ra",
    "-q",
]
testpaths = ["tests"]
python_files = "test_*.py tests_*.py *_test.py"
python_classes = "*Test Test* Describe*"
python_functions = "test_* it_* should_* scenario_*"

# ──────────────────────────────────────────────────────────────────────────────
#  Coverage
# ──────────────────────────────────────────────────────────────────────────────
[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]

# ──────────────────────────────────────────────────────────────────────────────
#  Deptry
# ──────────────────────────────────────────────────────────────────────────────
[tool.deptry]

# ──────────────────────────────────────────────────────────────────────────────
#  Scripts
# ──────────────────────────────────────────────────────────────────────────────
[project.scripts]
ai-hello-world = "ai_circus.tools.hello_world:main"
ai-check-api-keys = "ai_circus.tools.check_api_keys:main"
ai-commit = "ai_circus.tools.generate_commits_messages:run_main"
ai-sample-assistant = "ai_circus.assistants.sample_assistant:main"
ai-sample-agentic = "ai_circus.assistants.sample_agentic_assistant:main"
ai-generate-data-model = "ai_circus.tools.generate_data_model:main"
ai-config-drift-check = "ai_circus.tools.generate_data_model:check_env_drift"
ai-app = "ai_circus.app:main"
